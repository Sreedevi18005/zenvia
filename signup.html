<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Zenvia</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f6f8;
            padding: var(--spacing-md);
        }

        .auth-card {
            background: var(--white);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Provider Link -->
            <div class="text-center mb-4" style="padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
                <span class="badge"
                    style="background: #e0f2f1; color: #00695c; font-size: 0.9rem; padding: 6px 12px;">Are you a
                    professional?</span>
                <div style="margin-top: 8px;">
                    <a href="signup-provider.html"
                        style="color: var(--primary-color); font-weight: 700; text-decoration: underline;">Register as a
                        Service Provider</a>
                </div>
            </div>

            <h2 class="text-center mb-4" style="color: var(--primary-color);">Create Account</h2>

            <form action="customer-dashboard.html">
                <div class="grid grid-2" style="gap: 16px; margin-bottom: 16px;">
                    <div>
                        <label style="display:block; font-weight:600; margin-bottom:4px">Full Name</label>
                        <input type="text" placeholder="John Doe" required>
                    </div>
                    <div>
                        <label style="display:block; font-weight:600; margin-bottom:4px">Phone Number</label>
                        <input type="tel" placeholder="+91 XXXXX XXXXX" required>
                    </div>
                </div>

                <div class="mb-2">
                    <label style="display:block; font-weight:600; margin-bottom:4px">Email Address</label>
                    <input type="email" placeholder="john@example.com" required>
                </div>

                <div class="mb-2">
                    <label style="display:block; font-weight:600; margin-bottom:4px">Address</label>
                    <textarea placeholder="Enter your full address"
                        style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm);"
                        rows="3"></textarea>
                </div>

                <div class="grid grid-2" style="gap: 16px; margin-bottom: 24px;">
                    <div>
                        <label style="display:block; font-weight:600; margin-bottom:4px">Password</label>
                        <input type="password" placeholder="Create password" required>
                    </div>
                    <div>
                        <label style="display:block; font-weight:600; margin-bottom:4px">Confirm Password</label>
                        <input type="password" placeholder="Confirm password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; margin-bottom: 16px;">Register</button>

                <div class="text-center" style="font-size: 0.9rem;">
                    Already have an account? <a href="login.html"
                        style="color: var(--secondary-color); font-weight: 600;">Login</a>
                </div>

                <!-- Admin Link -->
                <div class="text-center mt-4" style="padding-top: 16px; border-top: 1px solid var(--border-color);">
                    <a href="signup-admin.html" style="color: #666; font-size: 0.85rem;">Register as Admin</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
