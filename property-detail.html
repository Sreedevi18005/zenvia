<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details - Zenvia</title>
    <link rel="stylesheet" href="css/styles.css?v=1.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/auth_guard.js"></script>
    <style>
        .detail-gallery {
            aspect-ratio: 16/9;
            background: #eee;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .detail-gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-detail {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media(max-width: 768px) {
            .grid-detail {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="main-header">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="logo">
                <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 30L32 14L52 30V54H12V30Z" fill="#a28089" stroke="#a28089" stroke-width="2" />
                    <rect x="22" y="36" width="6" height="6" fill="#4a383d" />
                    <rect x="36" y="36" width="6" height="6" fill="#4a383d" />
                    <rect x="22" y="46" width="6" height="6" fill="#4a383d" />
                    <rect x="36" y="46" width="6" height="6" fill="#4a383d" />
                </svg>
                Zenvia
            </a>

            <button class="mobile-menu-btn" style="color: var(--text-color);"
                aria-label="Toggle navigation menu">☰</button>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="listings.html">Properties</a>
                <a href="services.html">Services</a>
                <a href="about.html">About Us</a>
                <span id="nav-auth-links">
                    <a href="login.html" id="navLoginBtn">Login</a>
                </span>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div id="loading">Loading details...</div>
            <div id="content" style="display:none;">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom: 8px;">
                    <h1 id="pTitle" style="margin:0;"></h1>
                    <span id="pListingBadge" class="badge"
                        style="display:none; font-size:0.9rem; padding: 4px 12px; border:none;"></span>
                </div>
                <p id="pLoc" class="mb-4" style="color: #666;"><i class="fas fa-map-marker-alt"></i> ...</p>

                <div class="grid-detail">
                    <div>
                        <div class="detail-gallery">
                            <img id="pImg" src=""
                                style="width:100%; height:100%; object-fit:cover; transition: opacity 0.3s;">
                        </div>
                        <div id="thumbGrid" class="flex" style="gap: 10px; overflow-x: auto; margin-bottom: 20px;">
                        </div>

                        <h3 class="mb-2">Description</h3>
                        <p id="pDesc" style="line-height: 1.6; color: #333;"></p>
                    </div>

                    <div class="card" style="height: fit-content; padding: 24px;">
                        <h3 class="mb-4" style="color: var(--secondary-color);" id="pPrice">₹ ...</h3>
                        <div class="mb-4">
                            <strong>Type:</strong> <span id="pType"></span><br>
                            <strong>Offer:</strong> <span id="pListingType"
                                style="text-transform: capitalize;"></span><br>
                            <strong>Owner:</strong> <span id="pOwner"></span><br>
                            <strong>Posted On:</strong> <span id="pDate"></span>
                        </div>
                        <button class="btn btn-primary" style="width: 100%;" onclick="bookProperty()">Book Now</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Custom Payment Modal -->
    <div id="paymentModal" class="payment-overlay">
        <div class="payment-window">
            <div class="payment-header">
                <span>Zenvia Secure Payment</span>
                <span onclick="closePaymentModal()" style="cursor:pointer;">&times;</span>
            </div>
            <div class="payment-body">
                <div class="payment-row">
                    <span>Payable Amount:</span>
                    <strong id="pay-amount-display">₹...</strong>
                </div>
                <div class="payment-row" style="color:#666; font-size:0.8rem;">
                    <span>Payment Method:</span>
                    <span>Test Credit Card</span>
                </div>
                <button class="pay-btn" onclick="processCustomPayment()">SIMULATE SUCCESSFUL PAYMENT</button>
                <div class="pay-cancel" onclick="closePaymentModal()">Cancel and go back</div>
            </div>
        </div>
    </div>

    <script src="js/auth_guard.js"></script>
    <script src="js/scripts.js"></script>
    <script>
        let propertyId = null;
        let price = 0;
        let currentAdvance = 0;

        async function loadDetails() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) { alert('No property ID specified'); window.location.href = 'listings.html'; return; }
            propertyId = id;

            const res = await fetch(`../backend/get_property.php?id=${id}`);
            const data = await res.json();

            if (data.status === 'success') {
                const p = data.data;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                document.getElementById('pTitle').innerText = p.title;
                document.getElementById('pLoc').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${p.location}`;
                document.getElementById('pDesc').innerText = p.description;
                document.getElementById('pPrice').innerText = `₹ ${parseInt(p.price).toLocaleString()}`;

                document.getElementById('pType').innerText = p.type;
                document.getElementById('pListingType').innerText = p.listing_type || 'Sale';

                const badge = document.getElementById('pListingBadge');
                if (p.listing_type) {
                    badge.innerText = `For ${p.listing_type.charAt(0).toUpperCase() + p.listing_type.slice(1)}`;
                    badge.style.background = p.listing_type === 'rent' ? '#e8f5e9' : '#fff3e0';
                    badge.style.color = p.listing_type === 'rent' ? '#2e7d32' : '#ef6c00';
                    badge.style.display = 'inline-block';
                }

                document.getElementById('pOwner').innerText = p.owner_name;

                const date = p.created_at ? new Date(p.created_at).toLocaleDateString() : 'Recently';
                document.getElementById('pDate').innerText = date;

                price = p.price;

                const imgList = p.images && p.images.length > 0 ? p.images : [];
                const mainImg = imgList.length > 0 ? (imgList[0].startsWith('http') ? imgList[0] : '../backend/' + imgList[0]) : 'https://via.placeholder.com/1200x600';

                const mainImgEl = document.getElementById('pImg');
                mainImgEl.src = mainImg;

                const thumbGrid = document.getElementById('thumbGrid');
                thumbGrid.innerHTML = '';

                if (imgList.length > 1) {
                    imgList.forEach((src, index) => {
                        const fullSrc = src.startsWith('http') ? src : '../backend/' + src;
                        const activeBorder = index === 0 ? 'border: 2px solid var(--secondary-color);' : 'border: 2px solid transparent;';

                        thumbGrid.innerHTML += `
                            <div style="width: 80px; height: 60px; border-radius: 4px; overflow: hidden; cursor: pointer; flex-shrink: 0; ${activeBorder}" 
                                 onclick="changeMainImage('${fullSrc}', this)">
                                <img src="${fullSrc}" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                        `;
                    });
                }
            } else {
                alert('Property not found');
                window.location.href = 'listings.html';
            }
        }

        function changeMainImage(src, thumb) {
            const mainImg = document.getElementById('pImg');
            mainImg.style.opacity = '0.5';
            setTimeout(() => {
                mainImg.src = src;
                mainImg.style.opacity = '1';
            }, 100);

            const thumbs = document.getElementById('thumbGrid').children;
            for (let t of thumbs) {
                t.style.border = '2px solid transparent';
            }
            thumb.style.border = '2px solid var(--secondary-color)';
        }

        async function bookProperty() {
            const authRes = await fetch('../backend/check_session.php');
            const session = await authRes.json();
            if (!session.logged_in) {
                if (confirm("Please login to book this property.")) window.location.href = 'login.html';
                return;
            }

            currentAdvance = price * 0.02; // 2% Advance
            if (confirm(`Confirm booking for ₹ ${price.toLocaleString()}? Advance payment of ₹ ${currentAdvance.toLocaleString()} is required.`)) {
                document.getElementById('pay-amount-display').innerText = `₹ ${currentAdvance.toLocaleString()}`;
                document.getElementById('paymentModal').style.display = 'flex';
            }
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        async function processCustomPayment() {
            const payBtn = event.target;
            payBtn.innerText = "Processing...";
            payBtn.disabled = true;

            const paymentId = "pay_custom_" + Math.random().toString(36).substr(2, 9);
            await confirmBooking(paymentId, currentAdvance);
            closePaymentModal();
        }

        async function confirmBooking(paymentId, advance) {
            const fd = new FormData();
            fd.append('type', 'property');
            fd.append('property_id', propertyId);
            fd.append('date', new Date().toISOString().split('T')[0]); // Today
            fd.append('total_amount', price);
            fd.append('payment_id', paymentId);
            fd.append('advance_paid', advance);

            try {
                const bRes = await fetch('../backend/book.php', { method: 'POST', body: fd });
                const bData = await bRes.json();
                if (bData.status === 'success') {
                    alert(`Booking Confirmed! Advance paid: ₹ ${advance.toLocaleString()}`);
                    window.location.href = 'customer-dashboard.html';
                } else {
                    alert(bData.message);
                }
            } catch (err) {
                console.error(err);
                alert("Error connecting to server.");
            }
        }

        document.addEventListener('DOMContentLoaded', loadDetails);
    </script>
</body>

</html>
