<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zenvia</title>
    <link rel="stylesheet" href="css/styles.css?v=1.2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            padding: var(--spacing-md);
        }

        .auth-card {
            background: #ffffff;
            /* White card */
            padding: 40px;
            border-radius: var(--radius-md);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        input {
            background: #ffffff !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-dark) !important;
        }

        input::placeholder {
            color: #999;
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: var(--spacing-lg);
            color: var(--primary-color);
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="logo text-center mb-4"
                style="display:flex; justify-content:center; align-items:center; gap:10px;">
                <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 30L32 14L52 30V54H12V30Z" fill="#a28089" stroke="#a28089" stroke-width="2" />
                    <rect x="22" y="36" width="6" height="6" fill="#4a383d" />
                    <rect x="36" y="36" width="6" height="6" fill="#4a383d" />
                    <rect x="22" y="46" width="6" height="6" fill="#4a383d" />
                    <rect x="36" y="46" width="6" height="6" fill="#4a383d" />
                </svg>
                Zenvia
            </a>
            <h3 class="text-center mb-4">Welcome Back</h3>

            <form id="loginForm">
                <input type="hidden" name="action" value="login">
                <div class="mb-2">
                    <label style="display:block; font-weight:600; margin-bottom:4px">Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="mb-4">
                    <label style="display:block; font-weight:600; margin-bottom:4px">Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">Login</button>

                <div class="text-center" style="font-size: 0.9rem;">
                    Don't have an account? <a href="signup.html"
                        style="color: var(--secondary-color); font-weight: 600;">Sign Up</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const response = await fetch('../backend/auth.php', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (result.status === 'success') {
                // Store user info if needed
                localStorage.setItem('user', JSON.stringify(result.user));
                window.location.href = result.redirect;
            } else {
                alert(result.message);
            }
        });
    </script>
</body>

</html>
