<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zenvia</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f6f8;
            padding: var(--spacing-md);
        }

        .auth-card {
            background: var(--white);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: var(--spacing-lg);
            color: var(--primary-color);
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="logo">Zenvia</h2>
            <h3 class="text-center mb-4">Welcome Back</h3>

            <form action="index.html">
                <div class="mb-2">
                    <label style="display:block; font-weight:600; margin-bottom:4px">Role</label>
                    <select name="role" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;">
                        <option value="">Select Role</option>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                        <option value="provider">Provider</option>
                    </select>
                </div>
                
                <div class="mb-2">
                    <label style="display:block; font-weight:600; margin-bottom:4px">Username</label>
                    <input type="text" placeholder="Enter your username" required>
                </div>
                <div class="mb-4">
                    <label style="display:block; font-weight:600; margin-bottom:4px">Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">Login</button>

                <div class="text-center" style="font-size: 0.9rem;">
                    Don't have an account? <a href="signup.html"
                        style="color: var(--secondary-color); font-weight: 600;">Sign Up</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
