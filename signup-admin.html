<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration - Zenvia</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #333;
            /* Dark background for admin */
            padding: var(--spacing-md);
        }

        .auth-card {
            background: var(--white);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            border-top: 5px solid #d32f2f;
            /* Red for admin */
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="text-center mb-4" style="color: #d32f2f;">Admin Access</h2>

            <form action="admin-dashboard.html">
                <div class="mb-2">
                    <label style="display:block; font-weight:600; margin-bottom:4px">Admin Username</label>
                    <input type="text" placeholder="Enter admin username" required>
                </div>
                <div class="mb-4">
                    <label style="display:block; font-weight:600; margin-bottom:4px">Password</label>
                    <input type="password" placeholder="Create secure password" required>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; margin-bottom: 16px; background-color: #d32f2f;">Register Admin</button>

                <div class="text-center" style="font-size: 0.9rem;">
                    <a href="signup.html" style="color: #666;">Back to User Sign Up</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
